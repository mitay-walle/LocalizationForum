# Забирает утверждённые переводы с форума и коммитит их в папки языков.
# Запуски: после утверждения на форуме (repository_dispatch, если на форуме задан GITHUB_DISPATCH_TOKEN),
# раз в сутки на всякий случай и вручную. Почасового расписания нет: каждый запрос будит бесплатную базу форума.
name: Sync translations

on:
  repository_dispatch:
    types: [translations-updated]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forum-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORUM_API_URL: ${{ vars.FORUM_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Форум шлёт dispatch не чаще раза в 10 минут на игру. Ждём эти 10 минут, чтобы забрать и все
      # утверждения, сделанные после него (для них форум отдельный dispatch уже не пошлёт).
      - name: Подождать, пока модераторы закончат пачку утверждений
        if: github.event_name == 'repository_dispatch'
        run: sleep 600
      - run: node scripts/forum.mjs export
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -m "Перевод: синхронизация с форумом"
          git push
