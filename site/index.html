<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalizationForum</title>
  <meta name="description" content="Коллективный перевод игр: предлагайте варианты, голосуйте, модераторы утверждают.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f6f4f'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>Aя</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script>
    // Настройки интерфейса применяем до отрисовки, чтобы не мигала тема
    try {
      var ui = JSON.parse(localStorage.getItem('ui') || '{}');
      if (ui.theme === 'light' || ui.theme === 'dark') document.documentElement.dataset.theme = ui.theme;
      if (ui.size) document.documentElement.style.setProperty('--base-size', ui.size + 'px');
    } catch (e) {}
    // Язык интерфейса (точно его выберет app.js / i18n.js) — здесь только чтобы «Загрузка…» была на нужном языке
    try {
      var loc = String((ui && ui.locale) || navigator.language || 'en').toLowerCase().split('-')[0];
      var LOADING = { ru: 'Загрузка…', en: 'Loading…', uk: 'Завантаження…', de: 'Wird geladen…', es: 'Cargando…', fr: 'Chargement…', pt: 'Carregando…', pl: 'Ładowanie…', zh: '加载中…', ja: '読み込み中…' };
      if (!LOADING[loc]) loc = 'en';
      document.documentElement.lang = loc === 'pt' ? 'pt-BR' : loc;
      document.addEventListener('DOMContentLoaded', function () {
        var v = document.getElementById('view');
        if (v) v.innerHTML = '<p class="muted">' + LOADING[loc] + '</p>';
      });
    } catch (e) {}
  </script>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">Localization<span>Forum</span></a>
    <nav id="crumbs" class="crumbs"></nav>
    <div id="account" class="account"></div>
  </header>
  <main id="view" class="view"><p class="muted">Загрузка…</p></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
